name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/frontend-ci.yml'
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'prettier.config.mjs'
      - '.prettierignore'
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontend-ci.yml'
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'prettier.config.mjs'
      - '.prettierignore'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:web

      - name: Lint web app
        run: pnpm lint:web

      - name: Type-check web app
        run: pnpm typecheck:web

      - name: Test web app
        run: pnpm test:web

      - name: Build web app
        run: pnpm build:web

      - name: Install Playwright Chromium
        run: pnpm --filter @talkhugam/web exec playwright install --with-deps chromium

      - name: Run browser UI checks
        run: pnpm --filter @talkhugam/web test:e2e
