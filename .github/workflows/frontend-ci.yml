name: 프론트엔드 CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/frontend-ci.yml'
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'prettier.config.mjs'
      - '.prettierignore'
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontend-ci.yml'
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'prettier.config.mjs'
      - '.prettierignore'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 웹 품질 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v7

      - name: pnpm 설정
        uses: pnpm/action-setup@v6

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 잠금 파일 기준 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 코드 형식 검사
        run: pnpm format:web

      - name: 함수 책임 문서 검사
        run: pnpm docs:functions:web

      - name: 웹 코드 정적 검사
        run: pnpm lint:web

      - name: TypeScript 타입 검사
        run: pnpm typecheck:web

      - name: 웹 단위·컴포넌트 테스트
        run: pnpm test:web

      - name: 웹 production build
        run: pnpm build:web

      - name: Playwright Chromium 설치
        run: pnpm --filter @talkhugam/web exec playwright install --with-deps chromium

      - name: 브라우저 UI 검사
        run: pnpm --filter @talkhugam/web test:e2e
