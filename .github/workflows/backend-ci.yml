name: 백엔드 CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-functions:
    name: Edge Function 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v7

      - name: pnpm 설정
        uses: pnpm/action-setup@v6

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 잠금 파일 기준 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 고정된 Supabase CLI 버전 확인
        run: pnpm exec supabase --version

      - name: 백엔드 보안 정책 검사
        run: pnpm backend:check:security

      - name: Edge Function 타입 검사
        run: pnpm backend:check:functions

      - name: 백엔드 통합 테스트 타입 검사
        run: pnpm backend:check:integration

      - name: Edge Function 테스트
        run: pnpm backend:test:functions

  database:
    name: 데이터베이스 migration과 RLS 검사
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v7

      - name: pnpm 설정
        uses: pnpm/action-setup@v6

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 잠금 파일 기준 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 로컬 Supabase 시작
        run: pnpm backend:start

      - name: 빈 데이터베이스에 migration 적용
        run: pnpm backend:reset

      - name: 데이터베이스 schema 정적 검사
        run: pnpm backend:lint

      - name: pgTAP 계약 테스트
        run: pnpm backend:test:db

      - name: 로컬 Supabase 종료
        if: always()
        run: pnpm backend:stop

  secrets:
    name: 비밀값 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 전체 Git 이력 내려받기
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 저장소 비밀값 검사
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
